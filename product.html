<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Our Products</h1>

    <button onclick="logout()">Logout</button>

    <div class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="Smartphone">
            <h3>Smartphone</h3>
            <p>Powerful smartphone with a clear display.</p>
            <h3>₹15,000</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400" alt="Laptop">
            <h3>Laptop</h3>
            <p>Laptop suitable for study and work.</p>
            <h3>₹45,000</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
            <h3>Headphones</h3>
            <p>Wireless headphones with quality sound.</p>
            <h3>₹1,500</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
            <h3>Smart Watch</h3>
            <p>Stylish watch for everyday use.</p>
            <h3>₹2,000</h3>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
